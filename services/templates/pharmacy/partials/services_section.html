{% load static %}

<div class="services-section px-4 hidden">
    <div class="flex items-center justify-between mb-4">
        <div class="pharmacy-stepper">
            <div class="step-circle pharmacy-step-circle pharmacy-step-start active-step" data-step="1">1</div>
            <div class="step-line pharmacy-step-line" data-step="1"></div>
            <div class="step-circle pharmacy-step-circle pharmacy-step-end" data-step="2">2</div>
            <span class="step-label pharmacy-step-label pharmacy-step-start active-heading font-normal text-xs lg:text-base text-foggy-silver whitespace-nowrap" data-step="1">Add Medicine</span>
            <span class="step-label pharmacy-step-label pharmacy-step-end font-normal text-xs lg:text-base text-foggy-silver whitespace-nowrap" data-step="2">Summary</span>
        </div>
    </div>

    <div id="step-1" class="step-content space-y-5">
        <h2 class="text-lg md:text-[23.4px] font-bold text-desaturated-blue">Add Medicine</h2>

        <div class="services-list space-y-5">
            <div class="service-card rounded-lg px-4 py-6 relative bg-[#F9FAFB]">
                <button type="button" class="remove-service absolute top-3 right-3 text-ebony hover:text-red-500">x</button>

                <div class="mb-4 custom-dropdown">
                    <label class="text-base sm:text-lg text-jet-black font-semibold">Select Category</label>
                    <div class="dropdown-trigger mt-2">
                        <button type="button" class="w-full border border-slate-gray rounded-md px-3 py-3 text-left flex justify-between items-center">
                            <span class="selected-text text-sm sm:text-base font-normal text-dark-gray">Select Category</span>
                            <span class="material-symbols-outlined">keyboard_arrow_down</span>
                        </button>
                        <ul class="dropdown-menu category-menu hidden absolute z-20 mt-1 w-1/2 bg-white border border-dodger-blue rounded shadow text-sm sm:text-base text-dark-gray font-normal h-40 overflow-y-auto scroll">
                            {% for cat in medicine_categories %}
                                <li class="dropdown-item px-3 py-2 hover:bg-premium-light-blue cursor-pointer" data-category="{{ cat }}" data-value="{{ cat }}">{{ cat }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                </div>

                <div class="mb-4 custom-dropdown">
                    <label class="text-base sm:text-lg text-jet-black font-semibold">Select Medicine Name</label>
                    <div class="dropdown-trigger mt-2">
                        <button type="button" class="w-full border border-slate-gray rounded-md px-3 py-3 text-left flex justify-between items-center">
                            <span class="selected-text text-sm sm:text-base font-normal text-dark-gray">Select Medicine Name</span>
                            <span class="material-symbols-outlined">keyboard_arrow_down</span>
                        </button>
                        <ul class="dropdown-menu medicine-menu hidden absolute z-20 mt-1 w-1/2 bg-white border border-dodger-blue rounded shadow text-sm sm:text-base text-dark-gray font-normal h-40 overflow-y-auto scroll"></ul>
                    </div>
                </div>

                <div class="mb-4 custom-dropdown">
                    <label class="text-base sm:text-lg text-jet-black font-semibold">Select Medicine Type</label>
                    <div class="dropdown-trigger mt-2">
                        <button type="button" class="w-full border border-slate-gray rounded-md px-3 py-3 text-left flex justify-between items-center">
                            <span class="selected-text text-sm sm:text-base font-normal text-dark-gray">Select Medicine Type</span>
                            <span class="material-symbols-outlined">keyboard_arrow_down</span>
                        </button>
                        <ul class="dropdown-menu type-menu hidden absolute z-20 mt-1 w-1/2 bg-white border border-dodger-blue rounded shadow text-sm sm:text-base text-dark-gray font-normal h-40 overflow-y-auto scroll">
                            {% for t in medicine_types %}
                                <li class="dropdown-item px-3 py-2 hover:bg-premium-light-blue cursor-pointer" data-value="{{ t }}">{{ t }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                </div>

                <div class="grid grid-col-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="text-base sm:text-lg text-jet-black font-semibold">Quantity</label>
                        <input type="text" inputmode="numeric" pattern="[0-9]*" class="medicine-quantity w-full border border-slate-gray rounded-md px-3 py-3 mt-2 focus:outline-none" placeholder="10">
                    </div>
                    <div>
                        <label class="text-base sm:text-lg text-jet-black font-semibold">Price</label>
                        <input type="number" min="0" step="0.01" class="medicine-price w-full border border-slate-gray rounded-md px-3 py-3 mt-2 focus:outline-none" placeholder="0.00">
                    </div>
                </div>
            </div>
        </div>

        <button type="button" class="add-service border border-dodger-blue text-dodger-blue text-xs sm:text-sm font-semibold rounded-lg w-full max-w-[182px] h-[40px] cursor-pointer">+ Add More Medicine</button>

        <div class="file-upload-wrapper flex flex-col sm:flex-row sm:items-center gap-3">
            <input type="file" class="file-input hidden" accept=".csv">
            <div class="upload-box flex-1 border border-dashed border-dodger-blue rounded-lg px-3 py-2 flex justify-between items-center cursor-pointer">
                <div class="flex items-center gap-2 file-info">
                    <span class="material-symbols-outlined">image</span>
                    <span class="file-name text-sm font-normal text-jet-black">Upload CSV File</span>
                </div>
                <div class="flex items-center gap-2">
                    <button type="button" class="remove-file hidden text-red-500 text-lg">x</button>
                    <button type="button" class="upload-btn bg-dodger-blue text-white px-3 py-1 rounded text-lg">+</button>
                </div>
            </div>
            <button type="button" class="submit-btn w-full max-w-[120px] py-2 rounded-[10px] bg-light-gray text-sm sm:text-base cursor-not-allowed" disabled>
                Submit
            </button>
        </div>
        <div class="pharmacy-validation-message hidden rounded-md border px-3 py-2 text-sm font-semibold"></div>

        <div class="flex items-center justify-end gap-5">
            <button id="cancel-steps" type="button" class="step-btn w-full max-w-[270px] border border-strong-red text-strong-red py-3 rounded-lg text-sm font-normal cursor-pointer">
                Cancel
            </button>
            <button type="button" class="pharmacy-summary-next step-btn w-full max-w-[270px] bg-dodger-blue text-white py-3 rounded-lg text-sm font-normal cursor-pointer" data-target="2">
                Next
            </button>
        </div>
    </div>

    <div id="step-2" class="step-content space-y-5 hidden">
        <div class="flex flex-col gap-4">
            <h2 class="text-lg md:text-[23.4px] font-bold text-desaturated-blue">Medicine</h2>
            <div class="w-full p-3 bg-[#F9FAFB] rounded-[10px] grid grid-cols-1 lg:grid-cols-2 gap-4 pharmacy-summary-grid"></div>
        </div>

        <div class="flex items-center justify-end gap-5">
            <button type="button" class="step-btn w-full max-w-[270px] border border-strong-red text-strong-red py-3 rounded-lg text-sm font-normal cursor-pointer" data-target="1">
                Cancel
            </button>
            <button type="button" class="save-pharmacy-medicines w-full max-w-[270px] bg-dodger-blue text-white py-3 rounded-lg text-sm font-normal cursor-pointer">
                Save
            </button>
        </div>

        <div class="w-full h-[80px] rounded-[10px] border border-[#007BFF80] flex items-center gap-5 justify-between px-4">
            <span class="text-sm sm:text-base font-semibold text-blue-charcoal whitespace-nowrap">₹{{ subscription.price|default:"999" }} / Month</span>
            <button type="button" class="w-full max-w-[329px] rounded-lg h-[48px] bg-dodger-blue flex items-center justify-center text-sm font-semibold text-white cursor-pointer">
                Pay Now
            </button>
        </div>
    </div>
</div>
