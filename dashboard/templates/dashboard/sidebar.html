{% load static %}

<aside class="sidebar w-[200px] md:w-[280px] h-full max-h-screen transition-all transform duration-300 ease-in-out shadow-lg flex flex-col bg-white" id="sidebar">

    <!-- Profile Section (fixed) -->
    <div class="relative px-2 pt-6 pb-4 border-b border-gray-200 shrink-0">
        <div class="menu-toggle absolute right-2 top-3 h-7 w-7 bg-white border border-gray-200 shadow-sm flex items-center justify-center rounded-full cursor-pointer z-10">
            <span class="material-symbols-outlined text-gray-600 text-[18px] leading-none">chevron_left</span>
        </div>

        <div class="flex flex-col items-center gap-2">
            <div class="w-20 h-20 rounded-full border-[3px] border-pharmaceutical-green bg-soft-pastel-mint flex items-center justify-center">
                <span class="text-2xl font-bold text-pharmaceutical-green">{{ seller_initials|default:"MP" }}</span>
            </div>
            <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-soft-pastel-mint text-pharmaceutical-green text-xs font-medium">
                <span>👑</span> {{ seller_tier|default:"Premium Seller" }}
            </span>
            <p class="text-base font-bold text-charcoal-black text-center">{{ seller_name|default:"MedPlus Pharmacy" }}</p>
        </div>
    </div>

    <!-- Scrollable area: menu + Refer & Earn card -->
    <nav class="h-[calc(100%-160px)] py-4 overflow-y-auto no-scrollbar pb-8">
        <ul class="flex flex-col gap-1">
        {% for menu in sidebar_menu %}
            <li>
                <a href="{{ menu.url }}" 
                    class="flex items-center gap-3 px-6 py-3 w-full transition-colors
                        {% if request.path == menu.url or sidebar_active == menu.name|lower %}
                            bg-{{ secondary_bg }} text-{{ text }} font-semibold active-menu pr-5 border-r-4 border-{{ border }} 
                        {% else %}
                            hover:bg-gray-100
                        {% endif %}">
                    {% if menu.icon %}
                        <span class="material-symbols-outlined {% if menu.icon == 'emoji_events' %}material-filled{% endif %}">
                            {{ menu.icon }}
                        </span>
                    {% endif %}
                    <p>{{ menu.name }}</p>
                </a>
            </li>
        {% endfor %}
        </ul>
        <div class="w-full flex flex-col px-6 pb-4 mt-4">
            <a href="#">
                <img src="/static/images/Sale.svg" alt="Diamond User" loading="lazy" class="sidebar-image">
            </a>
        </div>
    </nav>
</aside>
